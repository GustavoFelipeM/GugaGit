name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure Git Identity
      run: |
        git config --global user.name "CI Runner"
        git config --global user.email "ci@runner.local"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov flake8

    - name: Run Linter (Flake8)
      run: |
        # Para o build se houver erros críticos de sintaxe ou variáveis não usadas
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos de estilo de código sem parar o build
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests with Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=src --cov-fail-under=80 --cov-report=term-missing tests/